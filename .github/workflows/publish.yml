name: Publish on push to main

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Build App
        run: npm run make

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-build
          path: out/make/
          retention-days: 1

  publish:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Download Artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Get Current Date
        id: date
        run: echo "date=$(date +'%Y%m%d')" >> "$GITHUB_OUTPUT"

      - name: Get Current Version Number
        id: version
        run: echo "version=$(npm pkg get version)" >> "$GITHUB_OUTPUT"

      - name: Get Artifact List
        id: files
        run: |
          {
            echo "files<<EOF"
            find artifacts -type f
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Release build
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.FILE_LIST }}
          name: ${{ env.RELEASE_NAME }}
          tag_name: ${{ env.TAG_NAME }}
          generate_release_notes: true
          prerelease: true
          draft: true
          fail_on_unmatched_files: true
        env:
          RELEASE_NAME: nightly-${{ steps.date.outputs.date }}-${{ steps.version.outputs.version }}
          TAG_NAME: nightly-${{ steps.date.outputs.date }}-${{ steps.version.outputs.version }}
          FILE_LIST: ${{ steps.files.outputs.files }}